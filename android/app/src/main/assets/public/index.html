        function cleanAccountName(accName) {
            if (!accName) return "토스증권(일반)";
            const str = String(accName).replace(/\s+/g, '');
            if (str.includes("토스") && !str.includes("연금")) return "토스증권(일반)";
            return accName;
        }

        window.onload = function() {
            const saved = localStorage.getItem('dividend_records_v03');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        let otherRecords = parsed.filter(item => cleanAccountName(item.account) !== "토스증권(일반)" && cleanAccountName(item.account) !== "신한은행");
                        records = [...baseRecords, ...otherRecords];
                    } else { records = [...baseRecords]; }
                } catch(e) { records = [...baseRecords]; }
            } else { records = [...baseRecords]; }

            const savedHidden = localStorage.getItem('dividend_hidden_tags_v03');
            if (savedHidden) {
                try { hiddenTags = JSON.parse(savedHidden); } catch(e) { hiddenTags = []; }
            }

            records.forEach(r => {
                if (r.stock) r.stock = r.stock.toUpperCase();
                const y = r.date.substring(0, 4);
                if (!availableYears.includes(y)) availableYears.push(y);
            });
            
            hiddenTags = hiddenTags.map(k => k.toUpperCase());
            availableYears.sort();

            renderYearOptions();
            saveToLocalStorage();
            updateUI();
        };

        function saveToLocalStorage() {
            localStorage.setItem('dividend_records_v03', JSON.stringify(records));
            localStorage.setItem('dividend_hidden_tags_v03', JSON.stringify(hiddenTags));
        }

        function resetAllData() {
            if (confirm("⚠️ 정말로 모든 내역을 초기화하시겠습니까?")) {
                localStorage.removeItem('dividend_records_v03');
                localStorage.removeItem('dividend_hidden_tags_v03');
                records = [...baseRecords];
                hiddenTags = [];
                availableYears = ["2026", "2027"];
                currentYear = "2026";
                renderYearOptions();
                saveToLocalStorage();
                updateUI();
                alert("초기화되었습니다.");
            }
        }

        function renderYearOptions() {
            const select = document.getElementById('yearSelect');
            let html = '';
            availableYears.forEach(y => { html += `<option value="${y}">${y}년</option>`; });
            html += `<option value="ADD">+ 추가</option>`;
            html += `<option value="DELETE">- 삭제</option>`;
            select.innerHTML = html;
            select.value = currentYear;
        }

        function changeYear(val) {
            if (val === 'ADD') {
                const newY = prompt('추가할 연도 입력 (예: 2027):');
                if (newY && /^\d{4}$/.test(newY)) {
                    if (!availableYears.includes(newY)) {
                        availableYears.push(newY);
                        availableYears.sort();
                    }
                    currentYear = newY;
                }
                renderYearOptions();
            } else if (val === 'DELETE') {
                deleteCurrentYear();
                return;
            } else { currentYear = val; }
            document.getElementById('calendarYearLabel').innerText = currentYear;
            updateUI();
        }

        function deleteCurrentYear() {
            if (availableYears.length <= 1) { alert('최소 하나의 연도는 필요합니다.'); renderYearOptions(); return; }
            const targetYear = currentYear;
            if (confirm(`[${targetYear}년] 데이터를 삭제하시겠습니까?`)) {
                records = records.filter(item => item.date.substring(0, 4) !== targetYear);
                availableYears = availableYears.filter(y => y !== targetYear);
                currentYear = availableYears[availableYears.length - 1];
                saveToLocalStorage();
                renderYearOptions();
                document.getElementById('calendarYearLabel').innerText = currentYear;
                updateUI();
            } else { renderYearOptions(); }
        }

        function filterStocks() {
            const input = document.getElementById('stockSearchInput');
            const keyword = input.value.trim().toLowerCase();
            const listContainer = document.getElementById('autocompleteList');

            if (keyword === '') { listContainer.style.display = 'none'; return; }

            const filtered = stockDatabase.filter(item => 
                item.name.toLowerCase().includes(keyword) || item.code.toLowerCase().includes(keyword)
            );

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="autocomplete-item" onclick="selectStock('${input.value.toUpperCase()}')">직접 입력: "${input.value.toUpperCase()}"</div>`;
            } else {
                let html = '';
                filtered.forEach(item => {
                    html += `<div class="autocomplete-item" onclick="selectStock('${item.name.toUpperCase()}')">${item.name} <span>(${item.code})</span></div>`;
                });
                listContainer.innerHTML = html;
            }
            listContainer.style.display = 'block';
        }

        function toggleStockTag(stockName) {
            const input = document.getElementById('stockSearchInput');
            const targetUpper = stockName.toUpperCase();
            if (input.value.trim().toUpperCase() === targetUpper) { input.value = ''; } 
            else { input.value = targetUpper; }
            document.getElementById('autocompleteList').style.display = 'none';
            syncTagSelection();
        }

        function selectStock(stockName) {
            document.getElementById('stockSearchInput').value = stockName.toUpperCase();
            document.getElementById('autocompleteList').style.display = 'none';
            syncTagSelection();
        }

        function syncTagSelection() {
            const currentVal = document.getElementById('stockSearchInput').value.trim().toUpperCase();
            document.querySelectorAll('.quick-stock-tag').forEach(tag => {
                const tagStock = tag.getAttribute('data-stock');
                if (tagStock && tagStock.toUpperCase() === currentVal) { tag.classList.add('selected'); } 
                else { tag.classList.remove('selected'); }
            });
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box-wrapper') && !e.target.closest('.quick-stock-tag')) {
                document.getElementById('autocompleteList').style.display = 'none';
            }
        });

        function addRecord() {
            const account = document.getElementById('accountSelect').value;
            const stock = document.getElementById('stockSearchInput').value.trim().toUpperCase();
            const date = document.getElementById('receiveDate').value;
            const amount = Number(document.getElementById('receiveAmount').value);

            if (!stock || !date || !amount) {
                alert('종목, 날짜, 금액을 모두 정확히 입력해주세요.');
                return;
            }

            const recYear = date.substring(0, 4);
            if (!availableYears.includes(recYear)) {
                availableYears.push(recYear);
                availableYears.sort();
                renderYearOptions();
            }

            const tagKey = (account + "_" + stock).toUpperCase();
            hiddenTags = hiddenTags.filter(k => k !== tagKey);

            records.push({ id: Date.now(), account, stock, date, month: date.substring(0, 7), amount });
            
            currentYear = recYear;
            document.getElementById('yearSelect').value = currentYear;
            document.getElementById('calendarYearLabel').innerText = currentYear;

            saveToLocalStorage();
            updateUI();
            
            document.getElementById('stockSearchInput').value = '';
            document.getElementById('receiveAmount').value = '';
            syncTagSelection();
        }

        function deleteRecord(id, event) {
            if(event) event.stopPropagation();
            records = records.filter(item => item.id !== id);
            saveToLocalStorage();
            updateUI();
            if (currentSelectedMonth) openModal(currentSelectedMonth);
            else if (currentAccountFilter) openAccountModal(currentAccountFilter);
        }

        function hideStockTag(stockName, event) {
            event.stopPropagation();
            const selectedAccount = document.getElementById('accountSelect').value;
            const tagKey = (selectedAccount + "_" + stockName).toUpperCase();
            if (!hiddenTags.includes(tagKey)) {
                hiddenTags.push(tagKey);
                saveToLocalStorage();
                updateQuickStocks();
            }
        }

        function openTrashModal() {
            const modal = document.getElementById('trashModal');
            const body = document.getElementById('trashModalBody');
            
            if (hiddenTags.length === 0) {
                body.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">숨긴 종목이 없습니다.</div>';
            } else {
                let html = '';
                hiddenTags.forEach(tagKey => {
                    const parts = tagKey.split('_');
                    const accName = parts[0];
                    const stkName = parts.slice(1).join('_');
                    const badgeText = getAccountBadgeName(accName);

                    html += `
                        <div class="detail-item">
                            <div>
                                <span style="background:#e2e8f0; padding:1px 4px; border-radius:4px; font-size:0.65rem; color:#334155; margin-right:4px;">${badgeText}</span>
                                <b style="font-size: 0.85rem;">${stkName}</b>
                            </div>
                            <div style="display: flex; gap: 4px;">
                                <button class="btn-trash-restore" onclick="restoreTag('${tagKey}')">복구</button>
                                <button class="btn-trash-delete" onclick="permanentlyDeleteStock('${accName}', '${stkName}', '${tagKey}')">삭제</button>
                            </div>
                        </div>
                    `;
                });
                body.innerHTML = html;
            }
            modal.style.display = 'flex';
        }

        function closeTrashModal() { document.getElementById('trashModal').style.display = 'none'; }

        function restoreTag(tagKey) {
            hiddenTags = hiddenTags.filter(k => k !== tagKey);
            saveToLocalStorage();
            updateQuickStocks();
            openTrashModal();
        }

        function permanentlyDeleteStock(accName, stockName, tagKey) {
            if (confirm(`'${stockName}' 종목의 모든 과거 기록을 삭제하시겠습니까?`)) {
                records = records.filter(item => !(cleanAccountName(item.account) === accName && item.stock.toUpperCase() === stockName.toUpperCase()));
                hiddenTags = hiddenTags.filter(k => k !== tagKey);
                saveToLocalStorage();
                updateUI();
                openTrashModal();
            }
        }

        function getSeasonClass(monthNum) {
            if (monthNum >= 3 && monthNum <= 5) return "season-spring";
            if (monthNum >= 6 && monthNum <= 8) return "season-summer";
            if (monthNum >= 9 && monthNum <= 11) return "season-autumn";
            return "season-winter";
        }

        function formatFullAmount(amt) {
            if (amt === 0) return '-';
            return amt.toLocaleString() + '원';
        }

        function updateUI() {
            let grandTotal = 0;
            const accountTotals = { "토스증권(일반)": 0, "토스증권(연금저축)": 0, "하나증권": 0, "한국증권": 0, "신한은행": 0 };
            const monthTotals = {};
            for(let i=1; i<=12; i++) {
                monthTotals[`${currentYear}-${String(i).padStart(2, '0')}`] = 0;
            }

            records.forEach(item => {
                if (item.date.substring(0, 4) === currentYear) {
                    const normAcc = cleanAccountName(item.account);
                    grandTotal += item.amount;
                    if (accountTotals[normAcc] !== undefined) accountTotals[normAcc] += item.amount;
                    if (monthTotals[item.month] !== undefined) monthTotals[item.month] += item.amount;
                }
            });

            document.getElementById('totalReceived').innerText = grandTotal.toLocaleString() + ' 원';
            document.getElementById('accIsa').innerText = accountTotals["하나증권"].toLocaleString() + '원';
            document.getElementById('accIrp').innerText = accountTotals["한국증권"].toLocaleString() + '원';
            document.getElementById('accTossGeneral').innerText = accountTotals["토스증권(일반)"].toLocaleString() + '원';
            document.getElementById('accTossPension').innerText = accountTotals["토스증권(연금저축)"].toLocaleString() + '원';
            document.getElementById('accShinhan').innerText = accountTotals["신한은행"].toLocaleString() + '원';

            updateQuickStocks();

            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';

            for(let i=1; i<=12; i++) {
                const mStr = `${currentYear}-${String(i).padStart(2, '0')}`;
                const amt = monthTotals[mStr] || 0;
                calendarGrid.innerHTML += `
                    <div class="calendar-cell ${getSeasonClass(i)} ${amt === 0 ? "empty" : ""}" onclick="openModal('${mStr}')">
                        <span class="month-label">${i}월</span>
                        <span class="month-amount">${formatFullAmount(amt)}</span>
                    </div>
                `;
            }
        }

        function isKorean(text) { return /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(text); }

        function updateQuickStocks() {
            const selectedAccount = document.getElementById('accountSelect').value;
            const quickContainer = document.getElementById('quickStocksContainer');
            const accountStocksMap = new Map();
            
            records.forEach(item => {
                if (cleanAccountName(item.account) === selectedAccount && item.stock) {
                    const trimmedUpper = item.stock.trim().toUpperCase();
                    const tagKey = (selectedAccount + "_" + trimmedUpper).toUpperCase();
                    if (!hiddenTags.includes(tagKey) && !accountStocksMap.has(trimmedUpper)) {
                        accountStocksMap.set(trimmedUpper, trimmedUpper);
                    }
                }
            });

            const stockList = Array.from(accountStocksMap.values());
            if (stockList.length === 0) {
                quickContainer.innerHTML = '<div style="font-size: 0.7rem; color: #94a3b8; padding: 2px 0;">표시할 보유 종목이 없습니다.</div>';
                return;
            }

            const sortedStocks = [
                ...stockList.filter(s => isKorean(s)).sort((a, b) => a.localeCompare(b, 'ko')),
                ...stockList.filter(s => !isKorean(s)).sort((a, b) => a.localeCompare(b, 'en'))
            ];

            let quickHtml = '';
            sortedStocks.forEach(stk => {
                quickHtml += `
                    <div class="quick-stock-tag" data-stock="${stk}" onclick="toggleStockTag('${stk}')">
                        <span>${stk}</span>
                        <span class="quick-stock-del" onclick="hideStockTag('${stk}', event)">✕</span>
                    </div>
                `;
            });
            quickContainer.innerHTML = quickHtml;
            syncTagSelection();
        }

        function getAccountBadgeName(acc) {
            const norm = cleanAccountName(acc);
            if (norm === "토스증권(일반)") return "토스일반";
            if (norm === "토스증권(연금저축)") return "토스연금";
            if (norm === "하나증권") return "하나ISA";
            if (norm === "한국증권") return "한국IRP";
            if (norm === "신한은행") return "신한퇴직";
            return norm;
        }

        function inspectStockDetail(stockName, recordDate, netAmount) {
            const targetUpper = stockName.toUpperCase();
            const dbItem = stockDatabase.find(s => s.name.toUpperCase() === targetUpper || s.code.toUpperCase() === targetUpper) || {
                name: targetUpper, code: targetUpper, exDate: "증권사 공시 참조", past1YearCount: 12, ytdCount: 8
            };

            const grossAmount = Math.round(netAmount / (1 - 0.154));
            const taxAmount = grossAmount - netAmount;

            const yearAllRecords = records.filter(r => r.date.substring(0, 4) === currentYear && r.stock.toUpperCase() === targetUpper)
                                          .sort((a, b) => new Date(a.date) - new Date(b.date));

            const totalYearAmount = yearAllRecords.reduce((sum, r) => sum + r.amount, 0);
            let sequenceIndex = yearAllRecords.findIndex(r => r.date === recordDate && r.amount === netAmount) + 1;
            if (sequenceIndex === 0) sequenceIndex = yearAllRecords.length;

            const visualCardHtml = `
                <div class="stock-info-card">
                    <div class="stock-info-header">
                        <div class="stock-info-top-row">
                            <span class="seq-badge">${currentYear}년 ${sequenceIndex}번째 수령건</span>
                            <span class="stock-code-badge">${dbItem.code}</span>
                        </div>
                        <div class="stock-info-title">${dbItem.name}</div>
                    </div>
                    <div class="info-grid">
                        <div class="info-box"><div class="info-box-label">세전 배당금액</div><div class="info-box-val">${grossAmount.toLocaleString()}원</div></div>
                        <div class="info-box"><div class="info-box-label">원천징수 세금 (15.4%)</div><div class="info-box-val tax">-${taxAmount.toLocaleString()}원</div></div>
                        <div class="info-box"><div class="info-box-label">실수령 배당금액 (세후)</div><div class="info-box-val highlight">${netAmount.toLocaleString()}원</div></div>
                        <div class="info-box"><div class="info-box-label">주요 배당락일 정보</div><div class="info-box-val" style="font-size: 0.75rem;">${dbItem.exDate}</div></div>
                    </div>
                    <div class="accumulated-summary-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; gap: 4px;">
                            <span class="accum-title-text">올해 [${dbItem.name}] 누적 수령액</span>
                            <span class="accum-value-text">${totalYearAmount.toLocaleString()}원</span>
                        </div>
                        <div class="count-summary-grid">
                            <div class="count-summary-card"><span class="count-card-label">최근 1년 지급</span><span class="count-card-val">총 ${dbItem.past1YearCount}회</span></div>
                            <div class="count-summary-card" style="border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0;"><span class="count-card-label">올해 종목 지급</span><span class="count-card-val">총 ${dbItem.ytdCount}회</span></div>
                            <div class="count-summary-card"><span class="count-card-label">내 계좌 수령</span><span class="count-card-val active">총 ${yearAllRecords.length}회</span></div>
                        </div>
                    </div>
                </div>
            `;

            const backBtn = `<button onclick="${currentSelectedMonth ? `openModal('${currentSelectedMonth}')` : `openAccountModal('${currentAccountFilter}')`}" style="margin-bottom: 8px; padding: 4px 10px; font-size: 0.72rem; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color:#334155;">← 리스트로 돌아가기</button>`;
            document.getElementById('modalBody').innerHTML = backBtn + visualCardHtml;
        }

        function openModal(month) {
            currentSelectedMonth = month;
            currentAccountFilter = null;
            document.getElementById('modalTitle').innerText = `${month} 배당 상세 리스트`;
            
            const monthData = records.filter(item => item.month === month).sort((a, b) => new Date(b.date) - new Date(a.date));
            let html = monthData.length === 0 ? '<div style="text-align: center; color: #888; padding: 20px;">내역이 없습니다.</div>' : '';
            
            monthData.forEach(i => {
                html += `
                    <div class="detail-item" onclick="inspectStockDetail('${i.stock}', '${i.date}', ${i.amount})">
                        <div style="flex: 1; min-width: 0; padding-right: 8px;">
                            <div style="font-size: 0.68rem; color: #64748b;">${i.date} <span style="background:#e2e8f0; padding:1px 4px; border-radius:4px; font-size:0.6rem; color:#334155; margin-left:3px;">${getAccountBadgeName(i.account)}</span></div>
                            <b style="font-size: 0.85rem; color:#0f172a; word-break: break-all;">${i.stock} <span style="font-size:0.65rem; color:#2563eb; font-weight:normal; white-space:nowrap;">(상세보기)</span></b>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
                            <span style="font-weight: bold; color: #2563eb; font-size: 0.85rem; white-space: nowrap;">${i.amount.toLocaleString()}원</span>
                            <button class="delete-btn" onclick="deleteRecord(${i.id}, event)">✕</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function openAccountModal(accountKey) {
            currentAccountFilter = accountKey;
            currentSelectedMonth = null;
            
            let titleName = `${currentYear}년 전체 배당 리스트`;
            if(accountKey !== "전체") titleName = `${currentYear}년 ${getAccountBadgeName(accountKey)} 리스트`;
            document.getElementById('modalTitle').innerText = titleName;

            const filteredData = records.filter(item => {
                const sameYear = item.date.substring(0, 4) === currentYear;
                return accountKey === "전체" ? sameYear : sameYear && cleanAccountName(item.account) === accountKey;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            let html = filteredData.length === 0 ? '<div style="text-align: center; color: #888; padding: 20px;">내역이 없습니다.</div>' : '';
            
            filteredData.forEach(i => {
                html += `
                    <div class="detail-item" onclick="inspectStockDetail('${i.stock}', '${i.date}', ${i.amount})">
                        <div style="flex: 1; min-width: 0; padding-right: 8px;">
                            <div style="font-size: 0.68rem; color: #64748b;">${i.date} <span style="background:#e2e8f0; padding:1px 4px; border-radius:4px; font-size:0.6rem; color:#334155; margin-left:3px;">${getAccountBadgeName(i.account)}</span></div>
                            <b style="font-size: 0.85rem; color:#0f172a; word-break: break-all;">${i.stock} <span style="font-size:0.65rem; color:#2563eb; font-weight:normal; white-space:nowrap;">(상세보기)</span></b>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
                            <span style="font-weight: bold; color: #2563eb; font-size: 0.85rem; white-space: nowrap;">${i.amount.toLocaleString()}원</span>
                            <button class="delete-btn" onclick="deleteRecord(${i.id}, event)">✕</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            currentSelectedMonth = null;
            currentAccountFilter = null;
        }

        function exportData() {
            if (records.length === 0) { alert('데이터가 없습니다.'); return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ records, hiddenTags, availableYears }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `dividend_V0.3_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        records = parsed.map(item => ({ ...item, account: cleanAccountName(item.account), stock: item.stock ? item.stock.toUpperCase() : '' }));
                    } else if (parsed.records && Array.isArray(parsed.records)) {
                        records = parsed.records.map(item => ({ ...item, account: cleanAccountName(item.account), stock: item.stock ? item.stock.toUpperCase() : '' }));
                        if (parsed.hiddenTags) hiddenTags = parsed.hiddenTags.map(k => k.toUpperCase());
                        if (parsed.availableYears) availableYears = parsed.availableYears;
                    }
                    
                    records.forEach(r => {
                        const y = r.date.substring(0, 4);
                        if (!availableYears.includes(y)) availableYears.push(y);
                    });
                    availableYears.sort();

                    renderYearOptions();
                    saveToLocalStorage();
                    updateUI();
                    alert('복구 완료되었습니다.');
                } catch (err) { alert('파일 오류 발생'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>
</html>
